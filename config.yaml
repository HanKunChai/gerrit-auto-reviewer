mode: "local_test"

gerrit:
  base_url: "http://gerrit.example.com:8080"
  auth:
    type: "http"
    username: "code-reviewer"
    # use_a_prefix: false  # 如果Nginx反向代理导致401，取消注释试试
  # password from env: GERRIT_PASSWORD

auto_review:
  enabled: true
  poll_interval: 600
  reviewer: "code-reviewer"
  query: "reviewer:code-reviewer+status:open"
  max_changes_per_poll: 50
  use_rules_engine: false
  max_concurrent_reviews: 2
  claude_timeout: 1800
  use_multi_dimension: true
  dimension_timeout: 1800
  max_concurrent_claude: 4
  reviewer_version: "v6"
  # Metis 内网 LLM 审查器 (替代 Claude Code)
  # false = 默认使用 Claude Code CLI; 内网禁止使用 claude agent 时改为 true
  use_metis: false
  metis:
    # 内网 Metis 部署包路径 (metis-intranet/venv): Windows 为 Scripts\metis.exe, Linux 为 venv/bin/metis
    executable: "<metis-intranet>/venv/Scripts/metis.exe"
    config: "<metis-intranet>/config/metis.yaml"
    tiktoken_cache_dir: "<metis-intranet>/tiktoken"
    timeout: 1800
    max_concurrent: 4
    # native: 每变更一次原生安全审查 (Metis 自带多维安全透镜, 推荐)
    # dimensions: 按下方 dimensions 逐维度并行审查 (仅对非 C/C++ 语言生效)
    review_mode: "native"
  dimensions:
    - name: "问题解决评估"
      folder: "problem-solving"
    - name: "安全"
      folder: "security"
    - name: "内存管理"
      folder: "memory"
    - name: "编码规范"
      folder: "coding-style"
    - name: "逻辑正确性"
      folder: "logic"
    - name: "业务逻辑"
      folder: "domain-logic"

repo:
  local_path: "./local-repo"
  # remote_url 自动从 gerrit.base_url + 项目名拼接，无需手动配置
  fallback_project: "default"
  gerrit_remote: "gerrit"
  initial_clone_depth: 10
  auto_deepen: true
  deepen_step: 100

local_test:
  repo_path: "./test-data/test-repo"
  base_branch: "base"
  feature_branch: "feature"

# Webhook (optional - requires Gerrit admin to configure Event System)
# Does NOT need to be enabled; polling is the default trigger mechanism.
webhook:
  enabled: false
  host: "0.0.0.0"
  port: 8081
  max_concurrent_reviews: 3

review:
  skip_binary_files: true
  skip_file_patterns:
    - "*.o"
    - "*.bin"
    - "*.a"
  min_review_score: -2
  max_review_score: 2

rules:
  enabled: true
  custom_rules_dir: "./review_rules/custom"

cache:
  enabled: true
  dir: "./.cache/review-cache"
  max_size_mb: 500
  ttl_hours: 24

svn:
  # 提交材料/归档合规检查, 按团队内部流程启用
  enabled: false
  username: ""        # 建议改用环境变量 SVN_USER
  password: ""        # 建议改用环境变量 SVN_PASSWORD
  # 归档表根路径 (<root>/{year}/{month}/领域问题修改表.xls 等)
  archive_base: "svn://your-svn-host/repo/archive"
  check_commit_material: true
  check_realm_archive: true
  check_requirement_archive: true
